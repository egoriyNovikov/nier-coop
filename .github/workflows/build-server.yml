name: Build Server
on: [push, pull_request, workflow_dispatch]
env:
  CGO_LDFLAGS: -Wl,--no-as-needed
jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: server
          - os: windows-latest
            binary: server.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install ENet
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libenet-dev pkg-config

      - name: Build
        working-directory: server
        run: go build -o ${{matrix.binary}} main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-${{runner.os}}
          path: |
            ${{github.workspace}}/server/${{matrix.binary}}
            ${{github.workspace}}/server/server.json
          if-no-files-found: error
