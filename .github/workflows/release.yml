name: Release
# Push a tag like v0.3.2 (same as AUTOMATAMP_VERSION in src/Version.hpp): builds the mod and the
# Windows server and publishes them as a GitHub release (pre-release while the mod is in testing).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  BUILD_TYPE: Release
jobs:
  server:
    # Same runner and shell as build-server.yml: the cgo build of ENet fails on windows-2022 under bash.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build -o server.exe main.go

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: server-windows
          path: ${{github.workspace}}/server/server.exe
          if-no-files-found: error

  release:
    needs: server
    # windows-latest ships only Visual Studio 2026, the project is built with VS 2022
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the tag matches the mod version
        run: |
          version=$(sed -n 's/#define AUTOMATAMP_VERSION "\(.*\)"/\1/p' src/Version.hpp)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match AUTOMATAMP_VERSION $version"
            exit 1
          fi

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build the mod
        run: cmake --build build --config $BUILD_TYPE --target automatamp

      - name: Download the server
        uses: actions/download-artifact@v7
        with:
          name: server-windows
          path: server-build

      - name: Package
        run: |
          dir="nier-coop-$GITHUB_REF_NAME"
          mkdir -p "$dir/automatamp_server"
          cp build/bin/automatamp/dinput8.dll "$dir/"
          cp server-build/server.exe server/server.json "$dir/automatamp_server/"
          cp .github/release/README.txt "$dir/"
          echo "$GITHUB_SHA" > "$dir/automatamp_revision.txt"
          7z a "$dir.zip" "$dir" > /dev/null

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=.github/release/README.txt
          gh release create "$GITHUB_REF_NAME" "nier-coop-$GITHUB_REF_NAME.zip" build/bin/automatamp/dinput8.dll \
            --title "nier-coop $GITHUB_REF_NAME" --notes-file "$notes" --prerelease
