name: Build Mod
on: [push, pull_request, workflow_dispatch]
env:
  BUILD_TYPE: Release
jobs:
  build:
    # windows-latest ships only Visual Studio 2026, the project is built with VS 2022
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target automatamp

      - name: Write revision
        run: echo ${{github.sha}} > ${{github.workspace}}/build/bin/automatamp/automatamp_revision.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: automatamp
          path: |
            ${{github.workspace}}/build/bin/automatamp/dinput8.dll
            ${{github.workspace}}/build/bin/automatamp/automatamp_revision.txt
          if-no-files-found: error
